
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCC Shelving Trainer</title><style>
:root{--ink:#171717;--paper:#fffdf9;--accent:#5b3f8c;--soft:#eee8f7;--good:#e7f5eb;--bad:#fff0ed;--line:#d8d0e3}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f2f8;color:var(--ink);font-size:19px;line-height:1.45}.app{max-width:1000px;margin:auto;min-height:100vh;background:var(--paper);padding:28px 32px 60px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:.2em 0}.eyebrow{font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.card{border:2px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;background:white}.call{font-family:Georgia,serif;font-weight:700;font-size:1.3em;white-space:pre-line;display:inline-block;border:2px solid #aaa;border-radius:7px;padding:12px 18px;background:#fff}.btn{border:0;border-radius:12px;padding:14px 20px;margin:6px;font-size:1rem;font-weight:800;cursor:pointer;background:var(--accent);color:white}.btn.secondary{background:#eee;color:#222;border:2px solid #aaa}.choice{display:block;width:100%;text-align:left;background:white;color:#111;border:2px solid #aaa}.choice:hover,.choice:focus{border-color:var(--accent);outline:3px solid #d9ccef}.feedback{padding:16px;border-radius:12px;margin-top:16px;font-weight:700}.good{background:var(--good);border:2px solid #6c9}.bad{background:var(--bad);border:2px solid #d88}.progress{height:12px;background:#e7e2ec;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent)}.shelf{display:flex;align-items:flex-end;gap:7px;border-bottom:12px solid #805b3a;padding:18px 10px 0;overflow-x:auto}.book{min-width:110px;min-height:190px;border:2px solid #555;border-radius:5px 5px 0 0;padding:12px 8px;background:#f7f7f7;font-family:Georgia,serif;font-weight:700;font-size:.82rem;line-height:1.3;white-space:pre-line}.gap{min-width:46px;height:190px;border:3px dashed #8d79aa;border-bottom:0;border-radius:7px 7px 0 0;cursor:pointer;background:#f4effb}.gap:hover,.gap:focus{background:#dfd3ef;outline:3px solid #b49bd5}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.hint{background:#fff8d8;border-left:6px solid #d5ad27;padding:14px}.small{font-size:.9rem;color:#555}.rule{font-size:1.12em;font-weight:800}.hidden{display:none}@media(max-width:650px){.app{padding:18px}.book{min-width:92px;font-size:.88rem}.shelf{gap:4px}.btn{width:100%;margin:5px 0}}
</style></head><body><main class="app"><div class="toolbar"><div class="eyebrow">Lenox Library • Student Assistant Training</div><button class="btn secondary" onclick="restart()">Restart</button></div><div class="progress"><div id="bar"></div></div><div id="screen"></div></main><script>
const lessons=[
{title:'Read the label',teach:`A call number tells you where a physical book belongs. Read it <b>line by line, from top to bottom</b>.`,q:'Which part do you compare first?',choices:['The first line: letters','The year','The last line'],a:0,why:'Start at the top. Compare the first line first, then move down only when the lines match.',call:'LB\n1139\n.L3\nT64\n2000'},
{title:'Level 1: Letters first',teach:`The first line is filed in <b>alphabetical order</b>. Also remember: <b>nothing comes before something</b>. So P comes before PC.`,q:'Which comes first on the shelf?',choices:['PC 4131 H3','P 25 .C25 vol.50'],a:1,why:'P comes before PC because nothing comes before something.'},
{title:'Level 2: Whole numbers',teach:`The second line is usually treated as a <b>whole number</b> and filed numerically.`,q:'Which comes first?',choices:['QC 178 W47','QC 793.3 S8 I78','QC 173 .A78 1983'],a:2,why:'173 comes before 178, and both come before 793.3.'},
{title:'Level 3: Decimal danger',teach:`When the second line is decimalized, compare the decimal values. When a line begins with a decimal and a letter, the numbers after the letter are also treated as <b>decimals, not whole numbers</b>.`,q:'Which comes first?',choices:['E 302 .H28','E 302 .H277'],a:1,why:'.H277 comes before .H28: think .277 before .280.'},
{title:'Level 4: Third-line surprises',teach:`On the third line, <b>letters come before numbers</b>. If a number looks like a year and has no decimal or letter in front of it, it comes before other third-line entries.`,q:'Which comes first?',choices:['E 302 1789 .L345','E 302 .A1 1998','E 302 .H277'],a:0,why:'The year-like 1789 has no decimal or letter before it, so it is shelved before the other third-line entries.'},
{title:'Level 5: Years',teach:`Publication years are in chronological order. If everything before the year matches, <b>no date comes before a date</b>.`,q:'Which comes first?',choices:['ZA 3075 .F736 2023','ZA 3075 .F736 2018','ZA 3075 .F736'],a:2,why:'With the preceding call number identical, the item with no date comes before dated items.'},
{title:'Level 6: Volumes and copies',teach:`Volumes and copies are treated like whole numbers. Copies also come before dates.`,q:'Which comes first?',choices:['ZA 3075 .F736 2018 v.2','ZA 3075 .F736 2018 v.1'],a:1,why:'v.1 comes before v.2.'}
];
const banks=[
[{q:'Which part do you compare first?',choices:['The first line: letters','The year','The last line'],a:0,why:'Start at the top. Compare the first line first.'},{q:'Both call numbers begin with LB. What do you compare next?',choices:['The second line','The year','The book title'],a:0,why:'When the first line matches, move to the second line.'},{q:'Two call numbers match through the letter-and-decimal line but have different years. What decides their order?',choices:['The year','Book height','Author first name'],a:0,why:'Keep moving line by line until you reach the first difference.'},{q:'The first two lines match. What should you do next?',choices:['Compare the next line','Jump to the year','Choose the thinner book'],a:0,why:'Read from top to bottom. When a line matches, move down to the next line.'}],
[{q:'Which comes first?',choices:['PC 4131 H3','P 25 .C25 vol.50'],a:1,why:'P comes before PC because nothing comes before something.'},{q:'Which comes first?',choices:['LC 4028.5 .O36 1998','LB 1139 .L3 T64 2000'],a:1,why:'LB comes before LC alphabetically.'},{q:'Which comes first?',choices:['ZA 3075 .F736 2018','PC 4131 H3'],a:1,why:'PC comes before ZA alphabetically.'},{q:'Which comes first?',choices:['P 100 .A2','PA 10 .B4'],a:0,why:'P comes before PA: nothing comes before something.'},{q:'Which comes first?',choices:['PR 100 .A2','PQ 900 .B3'],a:1,why:'Compare the first line alphabetically: PQ comes before PR.'}],
[{q:'Which comes first?',choices:['QC 178 W47','QC 793.3 S8 I78','QC 173 .A78 1983'],a:2,why:'173 comes before 178, and both come before 793.3.'},{q:'Which comes first?',choices:['QA 25 .A2','QA 9 .B3'],a:1,why:'The second line is a whole number: 9 comes before 25.'},{q:'Which comes first?',choices:['BF 100 .A1','BF 99 .B2'],a:1,why:'99 comes before 100 as a whole number.'},{q:'Which comes first?',choices:['QC 173.6 A4','QC 173.4 .C65'],a:1,why:'When the second line is decimalized, 173.4 comes before 173.6.'},{q:'Which comes first?',choices:['QA 305 .A2','QA 42 .B6'],a:1,why:'Treat the second line as a whole number: 42 comes before 305.'}],
[{q:'Which comes first?',choices:['E 302 .H28','E 302 .H277'],a:1,why:'.H277 comes before .H28: think .277 before .280.'},{q:'Which comes first?',choices:['E 302 .A1','E 302 .H277'],a:0,why:'Compare the letter first: A comes before H.'},{q:'Which comes first?',choices:['E 302 .H9','E 302 .H81'],a:1,why:'Treat the numerals as decimals: .81 comes before .90.'},{q:'Which comes first?',choices:['E 302 .B25','E 302 .B3'],a:0,why:'.25 comes before .30, so .B25 comes first.'},{q:'Which comes first?',choices:['E 302 .M7','E 302 .M65'],a:1,why:'Treat the numbers as decimals: .65 comes before .70, so .M65 comes first.'}],
[{q:'Which comes first?',choices:['E 302 1789 .L345','E 302 .A1 1998','E 302 .H277'],a:0,why:'The year-like 1789 has no decimal or letter before it, so it is shelved before the other third-line entries.'},{q:'Which third-line entry comes first?',choices:['.H28','.A1'],a:1,why:'Compare the letters alphabetically: A before H.'},{q:'Which comes first on the third line?',choices:['.H277','.1'],a:0,why:'Letters come before numbers on the third line.'},{q:'Which comes first?',choices:['E 302 1901 .A2','E 302 .A1 1890'],a:0,why:'A year-like number with no decimal or letter in front comes before other third-line entries.'},{q:'Which third-line entry comes first?',choices:['.C4','.B9'],a:1,why:'Compare the letters alphabetically: B comes before C.'}],
[{q:'Which comes first?',choices:['ZA 3075 .F736 2023','ZA 3075 .F736 2018','ZA 3075 .F736'],a:2,why:'With the preceding call number identical, the item with no date comes before dated items.'},{q:'Which dated item comes first?',choices:['ZA 3075 .F736 2020','ZA 3075 .F736 2016'],a:1,why:'Years are chronological: 2016 comes before 2020.'},{q:'Which comes first?',choices:['ZA 3075 .F736 1999','ZA 3075 .F736 2001'],a:0,why:'1999 comes before 2001.'},{q:'Everything above the year matches. Which is first?',choices:['No date','2018'],a:0,why:'No date comes before a date.'},{q:'Which dated item comes first?',choices:['ZA 3075 .F736 1987','ZA 3075 .F736 1994'],a:0,why:'Years are chronological: 1987 comes before 1994.'}],
[{q:'Which comes first?',choices:['ZA 3075 .F736 2018 v.2','ZA 3075 .F736 2018 v.1'],a:1,why:'v.1 comes before v.2.'},{q:'Which comes first?',choices:['ZA 3075 .F736 2018 v.10','ZA 3075 .F736 2018 v.2'],a:1,why:'Volume numbers are whole numbers: 2 comes before 10.'},{q:'Which comes first?',choices:['E 302 .2 .A2 S5 c.2','E 302 .2 .A2 S5 1958'],a:0,why:'Copies also come before dates.'},{q:'Which copy comes first?',choices:['c.3','c.1'],a:1,why:'Copy numbers are filed numerically: c.1 before c.3.'},{q:'Which volume comes first?',choices:['v.12','v.4'],a:1,why:'Volume numbers are whole numbers: v.4 comes before v.12.'}]
];
let step=-1,score=0,hints=0,phase='teach',round=0;
function setBar(){document.getElementById('bar').style.width=Math.max(4,((step+1)/(lessons.length+3))*100)+'%'}
function home(){step=-1;setBar();screen.innerHTML=`<h1>LCC Shelving Trainer</h1><p class="rule">Learn it. Try it. Shelve it.</p><div class="card"><h2>Before you shelve: What is LCC?</h2><p><b>LCC</b> stands for <b>Library of Congress Classification</b>. It is a system libraries use to organize books by subject and give each physical book a place on the shelf.</p><p>Each book has a <b>call number</b>—the group of letters and numbers on its spine label. The call number tells you where the book belongs and where it should be returned after someone uses it.</p><div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:22px 0"><div class="call">LB
1139
.L3
T64
2000</div><div style="flex:1;min-width:240px"><p><b>Call numbers are read from top to bottom.</b></p><p>They can contain letters, whole numbers, decimals, a publication year, and sometimes a volume or copy number.</p><p>You do not need to memorize all of that now. This trainer will show you how to read each part and give you plenty of practice.</p></div></div></div><div class="card"><h2>Your job in this training</h2><p>You’re working a shelving shift. Your job is to get every book into the right place.</p><p>We’ll learn <b>one rule at a time</b>, practice it several times, and only then move on. At the end, you’ll put the rules together on a simulated shelf.</p><button class="btn" onclick="next()">I’m ready — start training →</button></div><p class="small">No login. No grades. Make mistakes here before you make them in the stacks.</p>`}
function next(){step++;hints=0;phase='teach';setBar(); if(step<lessons.length) lesson(); else if(step===lessons.length) shelfChallenge(); else if(step===lessons.length+1) shelfRead(); else finish()}
function lesson(){const x=lessons[step];phase='teach';screen.innerHTML=`<div class="eyebrow">Lesson ${step+1} of ${lessons.length}</div><h1>${x.title}</h1><div class="card"><h2>Learn this first</h2><p>${x.teach}</p>${x.call?`<div class="call">${x.call}</div>`:''}<div class="hint" style="margin-top:18px"><b>How to use it:</b> Compare call numbers from the top down. Stay on the current line until you know which item comes first; only move to the next line when the current line matches.</div></div><button class="btn" onclick="practice()">Got it — let me try →</button>`}
function practice(){round=0;hints=0;practiceRound()}
function practiceRound(){const x=lessons[step],b=banks[step],q=b[round];phase='practice';screen.innerHTML=`<div class="eyebrow">Practice ${step+1} of ${lessons.length} • Round ${round+1} of ${b.length}</div><h1>${x.title}</h1><div class="card"><p class="rule">Build the habit before moving on.</p><h2>${q.q}</h2>${q.choices.map((c,i)=>`<button class="btn choice" onclick="answer(${i})">${c}</button>`).join('')}<button class="btn secondary" onclick="reviewLesson()">← Review the lesson</button><button class="btn secondary" onclick="hint()">I need a hint</button><div id="fb"></div><div id="hint"></div></div>`}
function reviewLesson(){const x=lessons[step];phase='review';screen.innerHTML=`<div class="eyebrow">Lesson ${step+1} of ${lessons.length} • Review</div><h1>${x.title}</h1><div class="card"><h2>Review this rule</h2><p>${x.teach}</p>${x.call?`<div class="call">${x.call}</div>`:''}<div class="hint" style="margin-top:18px"><b>How to use it:</b> Compare call numbers from the top down. Stay on the current line until you know which item comes first; only move to the next line when the current line matches.</div></div><button class="btn" onclick="practiceRound()">← Back to Practice ${round+1}</button><p class="small">Your progress in this lesson has been saved. You will return to the same practice question.</p>`}
function answer(i){const b=banks[step],q=b[round],fb=document.getElementById('fb');if(i===q.a){score++;const last=round===b.length-1;fb.innerHTML=`<div class="feedback good">✓ Correct. ${q.why}</div><button class="btn" onclick="${last?'next()':'morePractice()'}">${last?'Continue to the next rule →':'Next practice →'}</button>`}else fb.innerHTML=`<div class="feedback bad">Not quite. ${q.why}<br><span class="small">Try this one again. You do not need to rush.</span></div>`}
function morePractice(){round++;hints=0;practiceRound()}
function hint(){const x=lessons[step];hints++;const generic=['Start with the first line. Only move down when the lines match.','Find the first place where the call numbers are different.','Ask yourself: is this part alphabetical, a whole number, or a decimal?'];document.getElementById('hint').innerHTML=`<div class="hint"><b>Hint:</b> ${generic[Math.min(hints-1,2)]}</div>`}
const shelfBooks=[
 {call:'ZA\n3075\n.F736\n2018', books:['ZA\n3074\n.R2\n2022','ZA\n3075\n.F71\n2020','ZA\n3075\n.F736\n2023','ZA\n3075\n.G2\n2017'], a:1, why:'ZA and 3075 match. .F71 comes before .F736, and among matching .F736 call numbers, 2018 comes before 2023.'},
 {call:'LB\n1139\n.L25\n2004', books:['LB\n1138\n.R4\n2019','LB\n1139\n.L2\n2017','LB\n1139\n.L3\n2001','LB\n1140\n.A1\n1998'], a:1, why:'LB and 1139 match. Compare the letter-and-decimal line: .L2 comes before .L25, and .L25 comes before .L3.'},
 {call:'QC\n173.5\n.B4\n1992', books:['QC\n173\n.A78\n1983','QC\n173.4\n.C65\n1984','QC\n173.6\nA4\n1979','QC\n178\nW47'], a:1, why:'Compare the second line numerically. 173.5 belongs after 173.4 and before 173.6.'},
 {call:'E\n302\n.H28\n2003', books:['E\n302\n.A1\n1998','E\n302\n.H277\n2001','E\n302\n.H3\n1997','E\n303\n.A2\n2005'], a:1, why:'E and 302 match. For the letter-and-decimal line, .H277 comes before .H28, and .H28 comes before .H3.'},
 {call:'ZA\n3075\n.F736\n2018\nv.2', books:['ZA\n3075\n.F736\n2018','ZA\n3075\n.F736\n2018\nv.1','ZA\n3075\n.F736\n2018\nv.3','ZA\n3075\n.F736\n2020'], a:1, why:'Everything through 2018 matches. Volume numbers are whole numbers, so v.2 belongs after v.1 and before v.3.'}
];
let shelfRound=0;
function shelfChallenge(){shelfRound=0;shelfRoundScreen(true)}
function shelfRoundScreen(showInstructions=false){const x=shelfBooks[shelfRound];screen.innerHTML=`<div class="eyebrow">Shelf challenge • Book ${shelfRound+1} of ${shelfBooks.length}</div><h1>${shelfRound===0?'Now put books on the shelf':'Shelve another book'}</h1>${showInstructions?`<div class="card"><h2>How this challenge works</h2><p>The books already on the shelf are shown in order. Your job is to decide <b>where the returned book fits between them</b>.</p><p><b>1.</b> Read the RETURN call number.<br><b>2.</b> Compare it with the books on the shelf from <b>top to bottom</b>.<br><b>3.</b> The <b>dashed spaces</b> are places where the book could go.<br><b>4.</b> <b>Click the dashed space</b> where you think the returned book belongs.</p><div class="hint"><b>Remember:</b> Start with the first line. If it matches, move to the next line. Stop when you find the first difference.</div></div>`:''}<div class="card"><h2>Book to shelve</h2><p>Find where this book belongs:</p><div class="call">${x.call}</div></div><p class="rule">Choose one of the dashed spaces on the shelf:</p><div class="shelf">${x.books.map((b,i)=>`${i===0?'':`<button class="gap" aria-label="Place book in dashed space ${i}" onclick="gap(${i-1})"></button>`}<div class="book">${b}</div>`).join('')}</div><p class="small">Tip: You are clicking a <b>space</b>, not a book.</p><div id="fb"></div>`}
function gap(i){const x=shelfBooks[shelfRound],fb=document.getElementById('fb');if(i===x.a){const last=shelfRound===shelfBooks.length-1;fb.innerHTML=`<div class="feedback good">✓ Exactly. ${x.why}</div><button class="btn" onclick="${last?'next()':'nextShelfBook()'}">${last?'Continue →':'Shelve another book →'}</button>`}else fb.innerHTML=`<div class="feedback bad">Not there yet. Compare from the top and stop at the first difference. Try another gap.</div>`}
function nextShelfBook(){shelfRound++;shelfRoundScreen(false)}
function shelfRead(){screen.innerHTML=`<div class="eyebrow">Shelf reading</div><h1>One more shelving habit</h1><button class="btn secondary" onclick="shelfChallenge()">← Back</button><div class="card"><h2>Before you move on, check the shelf around your book.</h2><p>It’s easy to get tunnel vision while shelving. A book next to yours may already be out of place, even when you put your own book in the correct spot.</p><p><b>After shelving a book, scan roughly 5 books on each side.</b> Make sure the call numbers around it are still in order.</p><p>Also look at the <b>next shelf and the shelf below</b> when needed. Call-number order continues from one shelf to the next.</p></div><button class="btn" onclick="shelfReadPractice()">Continue to practice →</button>`}
function shelfReadPractice(){screen.innerHTML=`<div class="eyebrow">Shelf reading • Practice</div><h1>You shelved the book. Are you done?</h1><button class="btn secondary" onclick="shelfRead()">← Back to lesson</button><div class="card"><p>What should you do next?</p><button class="btn choice" onclick="readAns(0)">Move immediately to the next book on the cart.</button><button class="btn choice" onclick="readAns(1)">Scan roughly 5 books on each side and check where the sequence continues.</button><button class="btn choice" onclick="readAns(2)">Re-shelve the entire range.</button><div id="fb"></div></div>`}
function readAns(i){const fb=document.getElementById('fb');if(i===1){score++;fb.innerHTML=`<div class="feedback good">✓ Good shelf-reading habit. Check the surrounding books so you don’t place your book next to one that was already mis-shelved. Remember that the sequence may continue onto the next shelf or the shelf below.</div><button class="btn" onclick="next()">Finish training →</button>`}else fb.innerHTML=`<div class="feedback bad">Try again. Correct shelving includes checking the area around the book you just placed.</div>`}
function finish(){screen.innerHTML=`<div class="eyebrow">Training complete</div><h1>Nice work.</h1><div class="card"><h2>Your shelving survival rules</h2><p>✓ Read the <b>entire call number</b>, one line at a time.<br>✓ Letters are alphabetical; <b>nothing comes before something</b>.<br>✓ Know when numbers are <b>whole numbers</b> and when they are <b>decimals</b>.<br>✓ Some books have two letter-and-decimal lines.<br>✓ Check the surrounding shelf—not just the book in your hand.<br>✓ Look above/below when a call-number range continues onto another shelf.</p><button class="btn" onclick="restart()">Practice again</button></div>`}
function restart(){score=0;phase='teach';home()}const screen=document.getElementById('screen');home();
</script></body></html>
